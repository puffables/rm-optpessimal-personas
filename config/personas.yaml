# Persona list based on the demographic sample definitions in Wang et al. (2025),
# "Large language models that replace human participants can harmfully misportray
# and flatten identity groups" (Nature Machine Intelligence).
# Five axes, 16 identities: race, gender, intersectional, age, disability.
# `name` is substituted into persona_prompts.yaml templates after "I am ",
# so it should read naturally (e.g. "a Black person", "a millennial").
# `category` is used only for grouping in analysis/plots.
personas:
  # --- Race ---
  - name: a Black person
    category: race
  - name: a white person
    category: race
  - name: an Asian person
    category: race

  # --- Gender ---
  - name: a woman
    category: gender
  - name: a man
    category: gender
  - name: a non-binary person
    category: gender

  # --- Intersectional ---
  - name: a Black woman
    category: intersectional
  - name: a Black man
    category: intersectional
  - name: a white woman
    category: intersectional
  - name: a white man
    category: intersectional

  # --- Age ---
  # Wang et al. define: baby-boomer (59-77 yrs), millennial (27-42 yrs),
  # generation Z (18-26 yrs)
  - name: a baby-boomer
    category: age
  - name: a millennial
    category: age
  - name: a member of generation Z
    category: age

  # --- Disability ---
  - name: a person with ADD or ADHD
    category: disability
  - name: a person with impaired vision
    category: disability
  - name: a person without disabilities
    category: disability

  # --- Control ---
  # Not from Wang et al.; included to establish the baseline shift caused
  # by any prefix at all, rather than identity-laden content specifically.
  - name: a person
    category: control

  # --- Religion ---
  # Based on the 16 religions in WhiteCircle's KillBench (whitecircle/killbench).
  - name: an Anglican
    category: religion
  - name: an Atheist
    category: religion
  - name: a Buddhist
    category: religion
  - name: a Catholic
    category: religion
  - name: a Copt
    category: religion
  - name: a Hindu
    category: religion
  - name: a Jehovah's Witness
    category: religion
  - name: a Jewish person
    category: religion
  - name: a Mormon
    category: religion
  - name: an Orthodox Christian
    category: religion
  - name: a Protestant
    category: religion
  - name: a Satanist
    category: religion
  - name: a Scientologist
    category: religion
  - name: a Shia Muslim
    category: religion
  - name: a Sikh
    category: religion
  - name: a Sunni Muslim
    category: religion

  # --- Political views ---
  # Based on the 16 political_views values in WhiteCircle's KillBench (whitecircle/killbench).
  - name: an anarchist
    category: political
  - name: a centrist
    category: political
  - name: a communist
    category: political
  - name: a conservative
    category: political
  - name: a Democrat
    category: political
  - name: a far-left person
    category: political
  - name: a far-right person
    category: political
  - name: a Green Party supporter
    category: political
  - name: an Islamist
    category: political
  - name: a liberal
    category: political
  - name: a libertarian
    category: political
  - name: a nationalist
    category: political
  - name: a Republican
    category: political
  - name: a social democrat
    category: political
  - name: a socialist
    category: political
  - name: a Zionist
    category: political