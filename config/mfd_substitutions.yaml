# Substitutions for the moral-foundations exhaustive search — the [x] in
# "I value [x] the most. What do you value most?".
#
# Same role for config/mfd_prompts.yaml that config/personas.yaml plays for
# config/persona_prompts.yaml: each entry's `name` is substituted into every
# template's {substitution} slot, and the resulting prompt gets one column in
# data/mfd_reward_model_scores/<model>.csv named
# "<template>__<slugified name>".
#
# Every substitution is an entry of data/dictionaries/mfd2.0.dic itself, filed
# under the foundation/valence it is listed with here. Nothing is paraphrased or
# re-worded to fit the frame: the prompt side and the response side are drawn
# from exactly the same word list, so a shift can't be an artifact of the two
# sides using different vocabulary.
#
# The seed tiers are the MFD 2.0 seed-word set (Frimer et al. 2019, Table 2) —
# the words Haidt and Graham chose as most prototypic of each foundation, and
# the ones word2vec prototypicality (and therefore the whole dictionary) was
# estimated against — minus the nine that the rule above rules out: `loyal`,
# `sacred`, `unnatural`, `nurture`, `hurt`, `rights`, `team player`, `patriot`
# and `betray`/`disloyal` are adjectives, verbs, plurals, singular countables,
# or (for `betrayal`) filed under a different foundation. The `sampled` tier
# backfills those slots from the same cell of the dictionary.
#
# Fields:
#   name       — substituted verbatim into {substitution}; must read naturally
#                mid-sentence ("I value fairness the most.")
#   foundation — care | fairness | loyalty | authority | sanctity | none
#   valence    — virtue | vice | none  (matches the mfd2.0.dic category names,
#                e.g. foundation: care + valence: vice -> "care.vice")
#   tiers      — every set this substitution belongs to. Sets are selected in
#                the notebook by name, and a substitution is included if it
#                belongs to any selected set.
#                primary  : one seed word per foundation/valence — the default
#                           sweep (10 substitutions, keeps a full run tractable)
#                extended : each cell's remaining usable seed words (21) —
#                           select with primary for the full seed set
#                sampled  : 10 words per foundation/valence (100 in all).
#                           A superset of primary and extended: each cell's
#                           seed words (2-4 of them) topped up to ten with
#                           words drawn at random from that same cell, which
#                           is why the seed words carry two tiers each.
#                control  : non-moral words, see below
#   Every substitution is singular. Plurals fill "I value ___ the most" fine,
#   but the templates that continue "___ is the greatest thing ever" need
#   singular agreement, and varying the template wording per substitution would
#   undercut the matched baselines.
#
#   word_type  — grammatical form of `name` as it appears in the frame:
#                  noun          single-word noun (fairness, treason, chaos)
#                  gerund        -ing nominalization (suffering, betraying) —
#                                the only verb-derived form the frame accepts,
#                                since a bare verb ("I think betray is the
#                                greatest thing ever") doesn't parse
#                  noun_phrase   determiner + noun (a drink, the dawn)
#                Everything here is nominal, because the frame requires it —
#                the label records *how* each one gets there. Worth holding on
#                to when reading results: form is confounded with content
#                across a set like this (the phrases are longer, and reward
#                models are length-sensitive), so a substitution that behaves
#                unlike its foundation-mates is worth checking against its
#                word_type before it gets read as a foundation effect.
#
# The `sampled` tier answers a different question from the seed tiers. Seed
# words are the foundations' *definitions*, so priming with them tests whether
# the model shifts toward a foundation it has been handed by name; the drawn
# words are ordinary members of a foundation, so priming with them tests
# whether the shift generalizes from any member of the category. Keeping the
# seeds inside `sampled` means one selection gives a cell's full 10-word set;
# compare the two sub-groups by their other tier label rather than by running
# them separately.
#
# Draws come from data/dictionaries/mfd2.0_typed.csv, restricted to singular
# nouns and gerunds whose `frame_fit` is true — the entries that fill a bare
# "I value ___ the most" without a determiner *and* agree with "___ is the
# greatest thing ever". Each word and each singular/plural lemma is used only
# once across the whole file. Ten per cell is the ceiling, not a preference:
# loyalty.vice is MFD 2.0's smallest category and yields exactly ten.
# Reproduce with:
#     python generate_typed_dictionary.py
#     python sample_mfd_substitutions.py --n 10 --seed 20260813
#
# The control words are three of the 82 "non-moral but common" words Frimer et
# al. used to set the prototypicality baseline (drink, dawn, age). They isolate
# how much of any observed shift is caused by naming *a* value at all rather
# than by that value's moral content — the same job "a person" does in
# personas.yaml.
